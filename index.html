<script>
/* Load each library, falling back to a second CDN if the first one fails,
   and say plainly which one broke instead of showing a blank page. */
var LIBS = [
  { name: "React",    urls: ["https://unpkg.com/react@18.3.1/umd/react.production.min.js",
                             "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"],
                       check: function(){ return window.React; } },
  { name: "ReactDOM", urls: ["https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js",
                             "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"],
                       check: function(){ return window.ReactDOM; } },
  { name: "PropTypes",urls: ["https://unpkg.com/prop-types@15.8.1/prop-types.min.js",
                             "https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"],
                       check: function(){ return window.PropTypes; } },
  { name: "Recharts", urls: ["https://unpkg.com/recharts@2.12.7/umd/Recharts.js",
                             "https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"],
                       check: function(){ return window.Recharts; } },
  { name: "Tailwind", urls: ["https://cdn.tailwindcss.com/3.4.5",
                             "https://cdn.jsdelivr.net/npm/tailwindcss@3.4.5/lib/index.js"],
                       check: function(){ return true; }, optional: true }
];

function say(msg){ var d=document.getElementById("bootdetail"); if(d) d.textContent = msg; }
function fail(name, url){
  document.getElementById("boot").innerHTML =
    '<div class="err">Could not load ' + name + '.</div>' +
    '<div style="margin-top:8px">Check your internet connection and reload.</div>' +
    '<div style="margin-top:14px"><code>' + url + '</code></div>';
}

function loadOne(lib, done){
  var i = 0;
  function attempt(){
    if (i >= lib.urls.length) {
      if (lib.optional) { done(); } else { fail(lib.name, lib.urls[lib.urls.length-1]); }
      return;
    }
    var url = lib.urls[i++];
    var s = document.createElement("script");
    s.src = url;
    s.onload = function(){ lib.check() ? done() : attempt(); };
    s.onerror = function(){ attempt(); };
    document.head.appendChild(s);
  }
  attempt();
}

function loadAll(idx){
  if (idx >= LIBS.length) { boot(); return; }
  say("Loading " + LIBS[idx].name + "…");
  loadOne(LIBS[idx], function(){ loadAll(idx + 1); });
}

function boot(){
  say("Starting…");
  if (!window.__APP_DEFINED__ || typeof window.APP_BOOTSTRAP !== "function") {
    document.getElementById("boot").innerHTML =
      '<div class="err">The app code did not load.</div>' +
      '<div style="margin-top:8px">Reload the page. If it keeps happening, the file may be incomplete.</div>';
    return;
  }
  try {
    window.APP_BOOTSTRAP();
    document.getElementById("boot").style.display = "none";
  } catch (e) {
    document.getElementById("boot").innerHTML =
      '<div class="err">The app failed to start.</div><div style="margin-top:14px"><code>' + (e && e.message) + '</code></div>';
  }
}
window.addEventListener("error", function(e){
  if (e && e.message && document.getElementById("boot") && document.getElementById("boot").style.display !== "none") {
    say("Error: " + e.message);
  }
});
loadAll(0);
</script>
</body>
